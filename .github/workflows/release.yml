name: Release

# Publishes to npm with trusted publishing (OIDC): no npm token is stored anywhere. Each package's
# trusted publisher on npmjs.com must name this file, release.yml. See docs/releasing.md.

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # No dependency cache in release builds, and no registry-url: pnpm publishes to the default
      # registry and authenticates with the GitHub OIDC token, not a NODE_AUTH_TOKEN.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      # Opens or updates the "chore: release packages" pull request while changesets are pending;
      # once that pull request is merged, builds and runs `changeset publish` (pnpm publish, with
      # provenance under trusted publishing).
      - name: Create release pull request or publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          pr-title: "chore: release packages"
          commit-message: "chore: release packages"
